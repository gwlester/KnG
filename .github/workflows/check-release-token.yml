name: Check release token expiry

# VCM_RELEASES_TOKEN (a fine-grained token that lets Publish Downloads read the
# private Virtual Church Musician releases) expires. This compares today's date
# with the recorded expiry (repo variable VCM_RELEASES_TOKEN_EXPIRES, YYYY-MM-DD)
# and fails, which emails the repo owner, when 30 days or fewer remain. Renewal
# steps: Prompts/AWS_Deployment.md ("Renew the release token").

on:
  schedule:
    - cron: "0 14 1,15 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Compare the recorded expiry with today
    runs-on: ubuntu-latest
    steps:
      - name: Check
        shell: bash
        env:
          EXPIRES: ${{ vars.VCM_RELEASES_TOKEN_EXPIRES }}
        run: |
          if [ -z "${EXPIRES}" ]; then
            echo "::error::Set the repo variable VCM_RELEASES_TOKEN_EXPIRES to the token's expiry date (YYYY-MM-DD)."
            exit 1
          fi
          days=$(( ( $(date -u -d "${EXPIRES}" +%s) - $(date -u +%s) ) / 86400 ))
          echo "VCM_RELEASES_TOKEN expires ${EXPIRES} (${days} days from now)"
          if [ "${days}" -lt 0 ]; then
            echo "::error::VCM_RELEASES_TOKEN expired on ${EXPIRES}. Publishing will fail until it is renewed."
            exit 1
          elif [ "${days}" -le 30 ]; then
            echo "::error::VCM_RELEASES_TOKEN expires in ${days} days (${EXPIRES}). Renew it now."
            exit 1
          fi
