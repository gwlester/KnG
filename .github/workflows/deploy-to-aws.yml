name: Deploy to AWS

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-production-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
  S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
  PREVIEW_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.PREVIEW_CLOUDFRONT_DISTRIBUTION_ID }}
  TERRAFORM_WORKING_DIRECTORY: ${{ vars.TERRAFORM_WORKING_DIRECTORY }}

jobs:
  terraform:
    name: Apply Terraform
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Terraform deployment settings
        shell: bash
        run: |
          test -n "${AWS_REGION}"
          test -n "${AWS_DEPLOY_ROLE_ARN}"

      - name: Resolve Terraform working directory
        shell: bash
        run: |
          if [ -n "${TERRAFORM_WORKING_DIRECTORY}" ]; then
            tf_dir="${TERRAFORM_WORKING_DIRECTORY}"
          else
            tf_file="$(find . -name '*.tf' -print -quit)"
            if [ -z "${tf_file}" ]; then
              tf_dir="."
            else
              tf_dir="$(dirname "${tf_file}")"
            fi
          fi

          test -d "${tf_dir}"
          printf 'TERRAFORM_WORKING_DIRECTORY=%s\n' "${tf_dir}" >> "${GITHUB_ENV}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        shell: bash
        run: terraform -chdir="${TERRAFORM_WORKING_DIRECTORY}" fmt -check -recursive

      - name: Initialize Terraform
        shell: bash
        run: terraform -chdir="${TERRAFORM_WORKING_DIRECTORY}" init

      - name: Validate Terraform
        shell: bash
        run: terraform -chdir="${TERRAFORM_WORKING_DIRECTORY}" validate

      - name: Apply Terraform
        shell: bash
        run: terraform -chdir="${TERRAFORM_WORKING_DIRECTORY}" apply -auto-approve

  build-and-upload:
    name: Build and upload release
    needs: terraform
    if: ${{ always() && (needs.terraform.result == 'success' || needs.terraform.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify upload settings
        shell: bash
        run: |
          test -n "${AWS_REGION}"
          test -n "${AWS_DEPLOY_ROLE_ARN}"
          test -n "${S3_BUCKET_NAME}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: bash
        run: pip install -r requirements.txt

      - name: Build blog
        shell: bash
        run: python3 src/build_blog.py

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Blue-green upload: this release lands in its own releases/<sha>/
      # prefix, never touching whatever prefix is currently live -- nothing
      # user-facing changes until switch-live (below) flips CloudFront's
      # origin path to it. See Prompts/ToDo.md's "Blue-Green Deployments".
      - name: Upload release to S3
        shell: bash
        run: |
          aws s3 sync www "s3://${S3_BUCKET_NAME}/releases/${GITHUB_SHA}" --delete

      # Preview: point the always-unapproved preview distribution at this
      # release so it can be smoke-tested over real HTTPS before switch-live
      # promotes it. Optional -- no-ops until PREVIEW_CLOUDFRONT_DISTRIBUTION_ID
      # is set (see Prompts/AWS_Deployment.md).
      - name: Point preview at this release
        if: ${{ env.PREVIEW_CLOUDFRONT_DISTRIBUTION_ID != '' }}
        shell: bash
        run: |
          .github/scripts/set_cloudfront_origin_path.sh \
            "${PREVIEW_CLOUDFRONT_DISTRIBUTION_ID}" "/releases/${GITHUB_SHA}" > /dev/null

  switch-live:
    name: Switch live release
    needs: build-and-upload
    if: ${{ always() && needs.build-and-upload.result == 'success' }}
    runs-on: ubuntu-latest
    # Separate, protected environment: this is the one step that actually
    # changes what visitors see, so it requires manual approval (a required
    # reviewer configured on the "production-switch" GitHub Environment) --
    # the reviewer's job before approving is to smoke-test the new release.
    # Decided in Prompts/ToDo.md's "Blue-Green Deployments" item.
    environment: production-switch
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify switch settings
        shell: bash
        run: |
          test -n "${AWS_REGION}"
          test -n "${AWS_DEPLOY_ROLE_ARN}"
          test -n "${S3_BUCKET_NAME}"
          test -n "${CLOUDFRONT_DISTRIBUTION_ID}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Flip CloudFront origin path to the new release
        shell: bash
        run: |
          old_origin_path="$(.github/scripts/set_cloudfront_origin_path.sh \
            "${CLOUDFRONT_DISTRIBUTION_ID}" "/releases/${GITHUB_SHA}")"
          echo "OLD_ORIGIN_PATH=${old_origin_path}" >> "${GITHUB_ENV}"

      - name: Invalidate CloudFront cache
        shell: bash
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"

      # Retention: keep exactly the live release and the one it replaced
      # (the immediately-previous release, for a fast workflow_dispatch
      # rollback in rollback.yml) -- delete every other releases/<sha>/
      # prefix. "Previous" is read from the distribution itself above, not
      # tracked separately, so this stays correct across rollbacks too.
      - name: Clean up old releases (keep live + previous only)
        shell: bash
        run: |
          keep_new="${GITHUB_SHA}"
          keep_old="${OLD_ORIGIN_PATH#/releases/}"
          for prefix in $(aws s3api list-objects-v2 \
              --bucket "${S3_BUCKET_NAME}" --prefix "releases/" --delimiter "/" \
              --query 'CommonPrefixes[].Prefix' --output text); do
            sha="${prefix#releases/}"
            sha="${sha%/}"
            if [ -n "${sha}" ] && [ "${sha}" != "${keep_new}" ] && [ "${sha}" != "${keep_old}" ]; then
              echo "Deleting stale release: ${sha}"
              aws s3 rm "s3://${S3_BUCKET_NAME}/releases/${sha}/" --recursive
            fi
          done
